name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed only to publish the "Latest dev build" release from main.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the fixed debug key when the repo has one
        env:
          DUO_DEBUG_KEYSTORE: ${{ secrets.DUO_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DUO_DEBUG_KEYSTORE" ]; then
            echo "$DUO_DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/duo-debug.keystore"
            echo "DUO_DEBUG_STORE_FILE=$RUNNER_TEMP/duo-debug.keystore" >> "$GITHUB_ENV"
            echo "Signing with the repo's fixed debug key."
          else
            echo "::warning::No DUO_DEBUG_KEYSTORE secret. This build uses a one-off debug key and won't install over the previous build."
          fi
      - name: Verify public source export
        run: ./scripts/export-public-source.sh "$RUNNER_TEMP/DuoLauncher-public"
      - name: Build, test, and lint
        working-directory: ${{ runner.temp }}/DuoLauncher-public
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Publish the debug APK as "Latest dev build"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk="$RUNNER_TEMP/DuoDev-$short_sha.apk"
          cp "$RUNNER_TEMP/DuoLauncher-public/app/build/outputs/apk/debug/app-debug.apk" "$apk"
          gh release delete dev-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create dev-latest "$apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest dev build ($short_sha)" \
            --notes "Debug build of $short_sha from main. Open this page on the Duo and tap the APK to install."
